{% extends "base/base.html" %}
{% block title %}ثبت نام{% endblock %}

{% block content %}
<div class="container">
    <div class="form-card">
        <div class="page-header">
            <h1 class="page-title">ثبت نام در فروشگاه</h1>
        </div>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="form-errors">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-full" style="margin-top:0.5rem;">ثبت نام</button>
        </form>
    </div>
</div>
{% endblock %}
