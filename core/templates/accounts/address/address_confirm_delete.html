{% extends "base/base.html" %}
{% block title %}Delete {{ object }}{% endblock %}

{% block content %}
    <div>
        <div style="border-bottom: none; padding-bottom: 0; margin-bottom: 1.5rem;">
            <h1 style="font-size: 1.5rem;">Confirm Deletion</h1>
        </div>
        <form method="post">
            {% csrf_token %}
            <p style="color: var(--text-primary);">از حذف آدرس "{{ object }}" مطمعن هستید?</p>
            {{ form }}
            <div>
                <input type="submit" value="حذف">
                <a href="{% url 'accounts:addresses' %}" class="btn">لغو</a>
            </div>
        </form>
    </div>
{% endblock %}
