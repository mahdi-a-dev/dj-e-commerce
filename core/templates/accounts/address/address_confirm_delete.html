{% extends "base/base.html" %}
{% block title %}حذف {{ object }}{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="page-header">
            <h1 class="page-title">تایید حذف</h1>
        </div>
        <p>از حذف آدرس "{{ object }}" مطمئن هستید؟</p>
        <form method="post">
            {% csrf_token %}
            {{ form }}
            <div class="form-actions">
                <input type="submit" value="حذف" class="btn btn-outline">
                <a href="{% url 'accounts:addresses' %}" class="btn">لغو</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
