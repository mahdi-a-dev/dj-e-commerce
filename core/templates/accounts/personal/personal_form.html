{% extends "base/base.html" %}
{% block title %}{% endblock %}

{% block content %}
<div class="container">
    <div class="form-card">
        <div class="page-header">
            <h1 class="page-title">اطلاعات شخصی</h1>
        </div>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <div style="font-size:0.85rem; color:var(--color-text-light); margin-top:0.25rem;">{{ field.help_text }}</div>
                    {% endif %}
                    {% if field.errors %}
                        <div class="form-errors">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <div class="form-actions">
                <a href="{% url 'accounts:profile' %}" class="btn btn-outline">لغو</a>
                <button type="submit" class="btn">ثبت تغییرات</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
